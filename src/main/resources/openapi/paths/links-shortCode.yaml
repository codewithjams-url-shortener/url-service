parameters:
  - $ref: "../openapi.yaml#/components/parameters/ShortCodePathParam"
get:
  operationId: getLink
  summary: Get details of a Short Link
  responses:
    "200":
      description: Fetched Short Link
      content:
        application/json:
          schema:
            $ref: "../schemas/GetLinkResponse.yaml"
    "400":
      description: shortCode failed validation
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
    "404":
      description: Short Link not found
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
patch:
  operationId: updateLink
  summary: Update a Short Link
  parameters:
    - name: X-Management-Token
      description: >-
        Management token authorizing this edit. Required to succeed, but declared optional here
        so a missing header binds as null and is handled the same way as a mismatched token
        (403), rather than Spring's default 400 for a missing required header.
      in: header
      required: false
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/PatchLinkRequest.yaml"
  responses:
    "200":
      description: Updated Short Link
      content:
        application/json:
          schema:
            $ref: "../schemas/GetLinkResponse.yaml"
    "400":
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
    "403":
      description: Management token missing or does not match
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
    "404":
      description: Short Link not found
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
delete:
  operationId: deleteLink
  summary: Deletes a Short Link
  parameters:
    - name: X-Management-Token
      description: >-
        Management token authorizing this edit. Required to succeed, but declared optional here
        so a missing header binds as null and is handled the same way as a mismatched token
        (403), rather than Spring's default 400 for a missing required header.
      in: header
      required: false
      schema:
        type: string
  responses:
    "204":
      description: Short Link removed
    "400":
      description: shortCode failed validation
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
    "403":
      description: Management token missing or does not match
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
    "404":
      description: Short Link not found
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
