post:
  operationId: createLink
  summary: Create a shortened link
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/CreateLinkRequest.yaml"
  responses:
    "201":
      description: Link created
      content:
        application/json:
          schema:
            $ref: "../schemas/CreateLinkResponse.yaml"
    "400":
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
    "409":
      description: Custom alias already in use
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "../schemas/ErrorResponse.yaml"
